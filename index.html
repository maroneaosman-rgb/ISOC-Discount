<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISOC Member Discounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #14284A;
    --navy-deep: #0D1C34;
    --sand: #E7D8B4;
    --sand-pale: #F6EFDE;
    --paper: #FBF8F2;
    --ink: #1B2233;
    --ink-soft: #5C6270;
    --rule: #DCD2BB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--navy);
    color:var(--sand-pale);
    padding:2.6rem 1.5rem 2.2rem;
    text-align:center;
  }
  .crest{
    width:44px; height:44px;
    margin:0 auto 0.9rem;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0 0 0.35rem;
    letter-spacing:0.01em;
  }
  header p{
    margin:0;
    color:var(--sand);
    font-size:0.95rem;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:1.8rem 1.25rem 3rem;
  }
  .intro{
    color:var(--ink-soft);
    font-size:0.92rem;
    line-height:1.5;
    margin:0 0 1.8rem;
    text-align:center;
  }
  .category{
    margin-bottom:2.1rem;
  }
  .category h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.02rem;
    color:var(--navy);
    margin:0 0 0.6rem;
    padding-bottom:0.45rem;
    border-bottom:1.5px solid var(--navy);
  }
  .entry{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    padding:0.85rem 0;
    border-bottom:1px solid var(--rule);
  }
  .entry:last-child{border-bottom:none;}
  .entry-name{
    font-size:1rem;
    font-weight:500;
    color:var(--ink);
  }
  .entry-note{
    display:block;
    font-size:0.82rem;
    color:var(--ink-soft);
    font-weight:400;
    margin-top:0.15rem;
  }
  .entry-pct{
    flex-shrink:0;
    background:var(--sand);
    color:var(--navy-deep);
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:0.98rem;
    padding:0.4rem 0.8rem;
    border-radius:3px;
    white-space:nowrap;
  }
  footer{
    text-align:center;
    padding:1.5rem 1rem 2.4rem;
    color:var(--ink-soft);
    font-size:0.8rem;
  }
</style>
</head>
<body>

<header>
  <svg class="crest" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M27 6a15 15 0 1 0 0 32 12.5 12.5 0 1 1 0-32Z" fill="#E7D8B4"/>
    <path d="M32 8l0.9 2.6L35.5 11.5 32.9 12.4 32 15 31.1 12.4 28.5 11.5 31.1 10.6Z" fill="#E7D8B4"/>
  </svg>
  <h1>Swansea ISOC Member Discounts</h1>
  <p>Show your membership to claim these rates</p>
</header>

<main>
  <p class="intro">These are exclusive rates our committee has agreed with local businesses for ISOC members. Just show the vendor your membership card or confirmation email.</p>
  <div id="list"></div>
</main>

<footer>Swansea University Islamic Society &middot; Updated regularly</footer>

<script>
  // Edit this array to add, remove, or update discounts.
  // category groups entries under a heading. note is optional (e.g. terms).
  const discounts = [
    {
      category: "Food & Drink",
      items: [
        { name: "Example Kebab House", pct: "15% off", note: "Dine-in only, not with other offers" },
        { name: "Example Coffee Co.", pct: "10% off", note: "" }
      ]
    },
    {
      category: "Retail",
      items: [
        { name: "Example Barbers", pct: "20% off", note: "Student ID required" }
      ]
    },
    {
      category: "Services",
      items: [
        { name: "Example Gym", pct: "£5 off monthly membership", note: "" }
      ]
    }
  ];

  const list = document.getElementById('list');
  discounts.forEach(group => {
    const section = document.createElement('div');
    section.className = 'category';

    const h2 = document.createElement('h2');
    h2.textContent = group.category;
    section.appendChild(h2);

    group.items.forEach(item => {
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <div class="entry-name">${item.name}${item.note ? `<span class="entry-note">${item.note}</span>` : ''}</div>
        <div class="entry-pct">${item.pct}</div>
      `;
      section.appendChild(entry);
    });

    list.appendChild(section);
  });
</script>

</body>
</html>
